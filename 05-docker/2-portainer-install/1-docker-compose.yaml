#  source: https://docs.portainer.io/start/install-ce/server/swarm/linux

# first, retrieve the stack YML manifest:
# curl -L https://downloads.portainer.io/ce2-21/portainer-agent-stack.yml -o portainer-agent-stack.yml

# prepare your nfs volume mounting
# nano portainer-agent-stack.yml

version: '3.2'

services:
  agent:
    image: portainer/agent:lts
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network # Existing network for agent communication
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainer/portainer-ee:lts
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    ports:
      - "9443:9443"
      - "9000:9000"
    # - "8000:8000"   # Edge agent tunnel (only needed if you plan to use Edge agents — harmless otherwise).
    volumes:
      - /mnt/nas-nfs/portainer_data:/data # Mount it to the NAS path via the node, not directly to the NAS:
    networks:
     - agent_network  # Existing network for agent communication
     - proxy_network  # Added this to allow Portainer to be accessible via Nginx Proxy Manager
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]

networks:
  agent_network:
    driver: overlay
    attachable: true

  proxy_network:  # Added this external network for reverse proxy functionality
    external: true
    
volumes:
  portainer_data:

# Then use the downloaded YML manifest to deploy your stack:
# docker stack deploy -c portainer-agent-stack.yml portainer

# Portainer Server and the Agents have now been installed. You can check to see whether the Portainer Server and Agent containers have started by running docker ps:
# root@swm1:~# docker ps
# CONTAINER ID   IMAGE                    COMMAND     CREATED              STATUS              PORTS     NAMES
# b534050936fb   portainer/agent:2.21.5   "./agent"   About a minute ago   Up About a minute             portainer_agent.as87d6a8s7d6a8s7cascasdacazxca

# Check Portainer service is running
# root@swm1:~# docker service ls
# ID             NAME                  MODE         REPLICAS   IMAGE                           PORTS
# 0rnge1mdmhbc   portainer_agent       global       3/3        portainer/agent:2.21.5
# 0u7kcm1ot19f   portainer_portainer   replicated   1/1        portainer/portainer-ce:2.21.5   *:8000->8000/tcp, *:9000->9000/tcp, *:9443->






