version: "3.9"

services:
  postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/AUTHENTIK_PG_PASS
    secrets:
      - AUTHENTIK_PG_PASS
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - /mnt/nas-nfs/authentik/postgres:/var/lib/postgresql/data
    networks:
      - authentik_internal

  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG}
    command: server
    restart: unless-stopped
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/AUTHENTIK_PG_PASS
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: file:///run/secrets/AUTHENTIK_SECRET_KEY
    secrets:
      - AUTHENTIK_PG_PASS
      - AUTHENTIK_SECRET_KEY
    ports:
      - "${COMPOSE_PORT_HTTP:-9000}:9000"
      - "${COMPOSE_PORT_HTTPS:-9443}:9443"
    volumes:
      - /mnt/nas-nfs/authentik/media:/media
      - /mnt/nas-nfs/authentik/custom-templates:/templates
    networks:
      - authentik_internal
#     - proxy_network

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG}
    command: worker
    restart: unless-stopped
    user: root
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/AUTHENTIK_PG_PASS
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: file:///run/secrets/AUTHENTIK_SECRET_KEY
    secrets:
      - AUTHENTIK_PG_PASS
      - AUTHENTIK_SECRET_KEY
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/nas-nfs/authentik/media:/media
      - /mnt/nas-nfs/authentik/certs:/certs
      - /mnt/nas-nfs/authentik/custom-templates:/templates
    networks:
      - authentik_internal

networks:
  authentik_internal:
    driver: overlay
    attachable: true
# proxy_network:
#   external: true

secrets:
  AUTHENTIK_PG_PASS:
    external: true
  AUTHENTIK_SECRET_KEY:
    external: true
