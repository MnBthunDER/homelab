# https://github.com/Krazy998/mqtt-hisensetv/blob/master/README.md

executa_hisense_power:
  alias: TV - Power
  sequence:
    - service: mqtt.publish
      data:
        topic: '/remoteapp/tv/remote_service/XX:XX:XX:XX:XX:XX$normal/actions/sendkey'
        payload: 'KEY_POWER'

executa_hisense_input_tv:
  alias: TV - Input TV
  sequence:
    - service: mqtt.publish
      data:
        topic: '/remoteapp/tv/ui_service/XX:XX:XX:XX:XX:XX$normal/actions/changesource'
        payload: '{"displayname":"TV","hotel_mode":"","isDemo":false,"is_lock":"","is_signal":"","sourceid":"0","sourcename":"TV"}'

