# github
# Dsx2 > HA-HisenseTVviaMQTT https://github.com/Dsx2/HA-HisenseTVviaMQTT/blob/main/README.md
# sehaas > ha_hisense_tv https://github.com/sehaas/ha_hisense_tv/blob/main/README.md?plain=1
# tiagofreire-pt > Home_Assistant_Hisense_TV https://github.com/tiagofreire-pt/Home_Assistant_Hisense_TV

# certificates
# Hisense-mqtt-keyfiles https://github.com/d3nd3/Hisense-mqtt-keyfiles/blob/main/hi_keys.zip

connection hisense
listener 1885
address 65q8.company.com:36669
username hisenseservice
password multimqttservice
clientid HomeAssistant
bridge_cafile /ssl/hisense.crt
bridge_certfile /mosquitto/config/certs/rcm_certchain_pem.cer
bridge_keyfile /mosquitto/config/certs/rcm_pem_privkey.key # pkcs8
bridge_tls_version tlsv1.2
bridge_insecure true
start_type automatic
try_private true
topic +/remoteapp/# both
# topic /remoteapp/# both 0 <MQTT_PREFIX> ""
