# Hisense TV  WOL
switch:
 - platform: template
   switches:
     hisense_tv:
       icon_template: >
         {% if is_state('switch.hisense_tv','on') %}
           {{ 'mdi:television-classic' }}
         {% else %}
           {{ 'mdi:television-classic-off' }}
         {% endif %}
       friendly_name: 'Hisense TV'
       value_template: >
         {{ is_state('device_tracker.hisense_tv', 'home') }}
       turn_on:
         service: wake_on_lan.send_magic_packet
         data:
           mac: '00:00:00:00:00:00'
       turn_off:
         service: mqtt.publish
         data:
           topic: '/remoteapp/tv/remote_service/XX:XX:XX:XX:XX$normal/actions/sendkey'
           payload: 'KEY_POWER'

wake_on_lan:

sensor:
 - platform: mqtt
   name: "TV - Source"
   state_topic: "/remoteapp/mobile/broadcast/ui_service/state"
   value_template: "{{ value_json.sourceid }}"