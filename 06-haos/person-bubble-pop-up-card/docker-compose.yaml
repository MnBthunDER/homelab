type: custom:swipe-card
parameters:
  effect: coverflow
cards:
  - type: custom:button-card
    entity: person.4
    aspect_ratio: 4/4
    show_name: false
    show_icon: false
    styles:
      card:
        - padding: 4%
        - background-image: |
            [[[
              try {
                return (states["binary_sensor.pixel_6_pro_music_active"] && states["binary_sensor.pixel_6_pro_music_active"].state === "on")
                  ? 'url("/local/images/4-music-bitmoji.png")'
                  : 'url("/local/images/4-bitmoji.png")';
              } catch (e) { return 'none'; }
            ]]]
        - background-size: 90%
        - background-repeat: no-repeat
        - background-position: top center
        - "--keep-background": "true"
      custom_fields:
        location:
          - position: absolute
          - left: 4%
          - top: 4%
        battery:
          - position: absolute
          - right: 4%
          - top: 4%
        androidauto:
          - position: absolute
          - left: 4%
          - right: 4%
          - top: 4%
        ringer:
          - position: absolute
          - left: 6%
          - right: 50%
          - top: 4%
        bluetooth:
          - position: absolute
          - left: 50%
          - right: 4%
          - top: 4%
        media:
          - position: absolute
          - bottom: 4%
          - right: 4%
          - left: 4%
    custom_fields:
      location: |
        [[[
          try {
            const s = states["person.4"]?.state || '';
            if (s === "home") return `<ha-icon icon="mdi:home" style="width:22px;height:22px;color:#50A14F;"></ha-icon>`;
            if (s === "Work") return `<ha-icon icon="mdi:office-building" style="width:22px;height:22px;color:#FFA500;"></ha-icon>`;
            return `<ha-icon icon="mdi:home-export-outline" style="width:22px;height:22px;color:#e45649;"></ha-icon>`;
          } catch (e) { return `<ha-icon icon="mdi:help-circle" style="width:22px;height:22px;color:#e45649;"></ha-icon>`; }
        ]]]
      battery: |
        [[[
          try {
            const pct = Number(states['sensor.pixel_6_pro_battery_level']?.state || 0);
            const state = states['sensor.pixel_6_pro_battery_state']?.state?.toLowerCase() || '';
            let icon;
            if (state === 'charging') icon = 'mdi:battery-charging';
            else if (state === 'full') icon = 'mdi:battery';
            else if (pct <= 5) icon = 'mdi:battery-outline';
            else icon = `mdi:battery-${Math.floor(pct / 10) * 10}`;
            let color = '#50A14F';
            if (state === 'charging') color = '#52adff';
            else if (pct <= 30) color = '#e45649';
            else if (pct <= 50) color = '#ffa229';
            const pulseStyle = state === 'charging' ? `animation: pulse 1.5s infinite;` : '';
            return `
              <style>
                @keyframes pulse {
                  0% { filter: drop-shadow(0 0 0px ${color}); }
                  50% { filter: drop-shadow(0 0 6px ${color}); }
                  100% { filter: drop-shadow(0 0 0px ${color}); }
                }
              </style>
              <div style="display:flex;align-items:center;gap:4px;">
                <ha-icon icon="${icon}" style="width:18px;height:18px;color:${color};${pulseStyle}"></ha-icon>
                <span style="font-size:13px;font-weight:600;color:${color};${pulseStyle}">${pct}%</span>
              </div>`;
          } catch (e) { return `<ha-icon icon="mdi:battery-unknown" style="width:18px;height:18px;color:#999;"></ha-icon>`; }
        ]]]
      androidauto: |
        [[[
          try {
            const mode = states["binary_sensor.pixel_6_pro_android_auto"]?.state || '';
            if (mode === "off" || mode === "Disconnected") return `<ha-icon icon="mdi:car-off" style="width:20px;height:20px;color:#FFA500;"></ha-icon>`;
            return `<ha-icon icon="mdi:car" style="width:20px;height:20px;color:#50A14F;"></ha-icon>`;
          } catch (e) { return `<ha-icon icon="mdi:cellphone" style="width:20px;height:20px;color:#50A14F;"></ha-icon>`; }
        ]]]
      ringer: |
        [[[
          try {
            const mode = states["sensor.pixel_6_pro_ringer_mode"]?.state || '';
            if (mode === "silent") return `<ha-icon icon="mdi:cellphone-off" style="width:20px;height:20px;color:#e45649;"></ha-icon>`;
            if (mode === "vibrate") return `<ha-icon icon="mdi:vibrate" style="width:20px;height:20px;color:#FFA500;"></ha-icon>`;
            return `<ha-icon icon="mdi:cellphone" style="width:20px;height:20px;color:#50A14F;"></ha-icon>`;
          } catch (e) { return `<ha-icon icon="mdi:cellphone" style="width:20px;height:20px;color:#50A14F;"></ha-icon>`; }
        ]]]
      bluetooth: |
        [[[
          try {
            const on = (states["binary_sensor.pixel_6_pro_bluetooth_state"]?.state === "on");
            const icon = on ? 'mdi:bluetooth' : 'mdi:bluetooth-off';
            const color = on ? '#52adff' : '#e45649';
            return `<ha-icon icon="${icon}" style="width:20px;height:20px;color:${color};"></ha-icon>`;
          } catch (e) { return `<ha-icon icon="mdi:bluetooth-off" style="width:20px;height:20px;color:#e45649;"></ha-icon>`; }
        ]]]
      media: |
        [[[
          try {
            const m = states['media_player.spotify'] || {};
            const title = m.attributes?.media_title || '';
            const artist = m.attributes?.media_artist || '';
            const color = (m.state === 'playing') ? '#ffffff' : '#ffffff00';
            return `<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${color};font-size:13px;"><ha-icon icon="mdi:music" style="width:16px;height:16px;color:${color};"></ha-icon><span> ${title} - ${artist}</span></div>`;
          } catch (e) { return ''; }
        ]]]
  - type: custom:stack-in-card
    mode: vertical
    cards:
      - type: custom:button-card
        entity: person.4
        aspect_ratio: 4/1
        show_name: false
        show_icon: false
        styles:
          card:
            - padding: 6%
            - background: |
                [[[
                  return 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                ]]]
            - border-radius: 24px
            - box-shadow: 0 8px 32px rgba(102,126,234,0.35)
          custom_fields:
            greeting:
              - font-size: 13px
              - font-weight: 500
              - position: absolute
              - left: 6%
              - top: 12%
              - color: rgba(255,255,255,0.7)
            name:
              - font-size: 30px
              - font-weight: 700
              - position: absolute
              - left: 6%
              - top: 30%
              - color: "#ffffff"
              - letter-spacing: "-0.5px"
            location:
              - font-size: 14px
              - font-weight: 400
              - position: absolute
              - left: 6%
              - top: 68%
              - color: rgba(255,255,255,0.85)
            avatar_ring:
              - position: absolute
              - right: 6%
              - top: 50%
              - transform: translateY(-50%)
        custom_fields:
          greeting: |
            [[[
              const h = new Date().getHours();
              let g = 'Good evening';
              if (h < 12) g = 'Good morning';
              else if (h < 17) g = 'Good afternoon';
              return `<span>${g}</span>`;
            ]]]
          name: |
            [[[
              return '<span>4</span>';
            ]]]
          location: |
            [[[
              try {
                const loc = states["sensor.pixel_6_pro_geocoded_location"]?.state || '';
                if (!loc || loc === "unknown" || loc === "unavailable") {
                  return `<ha-icon icon="mdi:map-marker" style="width:14px;height:14px;"></ha-icon><span> Location unknown</span>`;
                }
                return `<ha-icon icon="mdi:map-marker" style="width:14px;height:14px;"></ha-icon><span> ${loc}</span>`;
              } catch (e) { return '<span>Location unknown</span>'; }
            ]]]
          avatar_ring: |
            [[[
              try {
                const s = Number(states['sensor.pixel_6_pro_daily_steps']?.state || 0);
                const goal = 10000;
                const pct = Math.min(s / goal, 1);
                const circumference = 2 * Math.PI * 22;
                const offset = circumference * (1 - pct);
                const color = s >= goal ? '#50A14F' : '#ffffff';
                return `
                  <svg width="56" height="56" viewBox="0 0 56 56">
                    <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
                    <circle cx="28" cy="28" r="22" fill="none" stroke="${color}" stroke-width="4"
                      stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
                      stroke-linecap="round" transform="rotate(-90 28 28)"
                      style="transition: stroke-dashoffset 1s ease;"/>
                    <text x="28" y="32" text-anchor="middle" fill="white" font-size="16" font-weight="700">${Math.round(pct * 100)}%</text>
                  </svg>`;
              } catch (e) { return ''; }
            ]]]
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: sensor.pixel_6_pro_daily_steps
            aspect_ratio: 1/1.15
            show_name: false
            show_icon: false
            styles:
              card:
                - padding: 8%
                - background: rgba(25,25,35,0.65)
                - border-radius: 20px
                - backdrop-filter: blur(10px)
                - box-shadow: 0 4px 16px rgba(0,0,0,0.15)
                - border: 1px solid rgba(255,255,255,0.06)
              custom_fields:
                ring:
                  - position: absolute
                  - top: 50%
                  - left: 50%
                  - transform: translate(-50%, -56%)
                value:
                  - position: absolute
                  - top: 50%
                  - left: 50%
                  - transform: translate(-50%, -42%)
                  - font-size: 18px
                  - font-weight: 700
                  - color: "#ffffff"
                  - text-align: center
                  - line-height: 1
                label:
                  - position: absolute
                  - bottom: 12%
                  - left: 50%
                  - transform: translateX(-50%)
                  - font-size: 12px
                  - font-weight: 500
                  - color: rgba(255,255,255,0.5)
                  - text-align: center
                  - text-transform: uppercase
                  - letter-spacing: 1px
                icon:
                  - position: absolute
                  - top: 10%
                  - left: 50%
                  - transform: translateX(-50%)
            custom_fields:
              icon: |
                [[[
                  return `<ha-icon icon="mdi:shoe-formal" style="width:22px;height:22px;color:#50A14F;"></ha-icon>`;
                ]]]
              ring: |
                [[[
                  try {
                    const steps = Number(states['sensor.pixel_6_pro_daily_steps']?.state || 0);
                    const goal = 5000;
                    const pct = Math.min(steps / goal, 1);
                    const circumference = 2 * Math.PI * 40;
                    const offset = circumference * (1 - pct);
                    const color = steps >= goal ? '#50A14F' : (steps >= 5000 ? '#FFA500' : '#e45649');
                    return `
                      <svg width="110" height="110" viewBox="0 0 110 110">
                        <circle cx="55" cy="55" r="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
                        <circle cx="55" cy="55" r="40" fill="none" stroke="${color}" stroke-width="8"
                          stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
                          stroke-linecap="round" transform="rotate(-90 55 55)"
                          style="transition: stroke-dashoffset 1s ease-in-out;"/>
                      </svg>`;
                  } catch (e) { return ''; }
                ]]]
              value: |
                [[[
                  try {
                    const steps = Number(states['sensor.pixel_6_pro_daily_steps']?.state || 0);
                    return `<span>${steps.toLocaleString()}</span>`;
                  } catch (e) { return '<span>0</span>'; }
                ]]]
              label: |
                [[[
                  return '<span>Steps</span>';
                ]]]
          - type: custom:button-card
            entity: sensor.pixel_6_pro_total_calories_burned
            aspect_ratio: 1/1.15
            show_name: false
            show_icon: false
            styles:
              card:
                - padding: 8%
                - background: rgba(25,25,35,0.65)
                - border-radius: 20px
                - backdrop-filter: blur(10px)
                - box-shadow: 0 4px 16px rgba(0,0,0,0.15)
                - border: 1px solid rgba(255,255,255,0.06)
              custom_fields:
                ring:
                  - position: absolute
                  - top: 50%
                  - left: 50%
                  - transform: translate(-50%, -56%)
                value:
                  - position: absolute
                  - top: 50%
                  - left: 50%
                  - transform: translate(-50%, -42%)
                  - font-size: 18px
                  - font-weight: 700
                  - color: "#ffffff"
                  - text-align: center
                  - line-height: 1
                label:
                  - position: absolute
                  - bottom: 12%
                  - left: 50%
                  - transform: translateX(-50%)
                  - font-size: 12px
                  - font-weight: 500
                  - color: rgba(255,255,255,0.5)
                  - text-align: center
                  - text-transform: uppercase
                  - letter-spacing: 1px
                icon:
                  - position: absolute
                  - top: 10%
                  - left: 50%
                  - transform: translateX(-50%)
            custom_fields:
              icon: |
                [[[
                  return `<ha-icon icon="mdi:fire" style="width:22px;height:22px;color:#ff6b6b;"></ha-icon>`;
                ]]]
              ring: |
                [[[
                  try {
                    const cals = Number(states['sensor.pixel_6_pro_total_calories_burned']?.state || 0);
                    const goal = Number(states['input_number.calorie_goal']?.state || 2000);
                    const pct = Math.min(cals / goal, 1);
                    const circumference = 2 * Math.PI * 40;
                    const offset = circumference * (1 - pct);
                    return `
                      <svg width="110" height="110" viewBox="0 0 110 110">
                        <circle cx="55" cy="55" r="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
                        <circle cx="55" cy="55" r="40" fill="none" stroke="#ff6b6b" stroke-width="8"
                          stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
                          stroke-linecap="round" transform="rotate(-90 55 55)"
                          style="transition: stroke-dashoffset 1s ease-in-out;"/>
                      </svg>`;
                  } catch (e) { return ''; }
                ]]]
              value: |
                [[[
                  try {
                    const cals = Number(states['sensor.pixel_6_pro_total_calories_burned']?.state || 0);
                    return `<span>${Math.round(cals).toLocaleString()}</span>`;
                  } catch (e) { return '<span>0</span>'; }
                ]]]
              label: |
                [[[
                  return '<span>Calories</span>';
                ]]]
      - type: custom:mini-graph-card
        entities:
          - sensor.pixel_6_pro_daily_steps
        name: Steps (48h)
        line_color: "#667eea"
        color_thresholds:
          - value: 0
            color: "#e45649"
          - value: 5000
            color: "#50A14F"
        hours_to_show: 48
        points_per_hour: 1
        show:
          graph: bar
          icon: false
        style: |
          ha-card {
            background: rgba(25,25,35,0.45) !important;
            border-radius: 20px !important;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.06);
          }
