fullnameOverride: netbird

management:
  image:
    tag: 0.74.7

  podCommand:
    args:
      - --port=80
      - --log-file=console
      - --log-level=info
      - --disable-anonymous-metrics=false
      - --dns-domain=netbird.selfhosted
      - --config=/etc/netbird/management.json

  envFromSecret:
    RELAY_PASSWORD: netbird-secrets/relayPassword

  configmap: |-
    {
      "LogLevel": "info",
      "LogFile": "console",
      "Port": 80,
      "DisableAnonymousMetrics": false,
      "SingleAccountModeDomain": "netbird.selfhosted",
      "DnsDomain": "netbird.selfhosted",
      "Stuns": [
        {
          "Proto": "udp",
          "URI": "stun:stun.netbird.io:3478",
          "Username": "",
          "Password": null
        }
      ],
      "Relay": {
        "Addresses": ["rels://relay.company.com:443"],
        "CredentialsTTL": "24h",
        "Secret": "YOURSECRETKEYHERE"
      },
      "Turns": [],
      "Signal": {
        "Proto": "https",
        "URI": "netbird.company.com:443",
        "Username": "",
        "Password": ""
      },
      "ReverseProxy": {
        "TrustedHTTPProxies": [],
        "TrustedHTTPProxiesCount": 0,
        "TrustedPeers": ["0.0.0.0/0"]
      },
      "DataDir": "/var/lib/netbird/",
      "DataStoreEncryptionKey": "YOURDATASTOREENCRYPTIONKEYHERE",
      "StoreConfig": {
        "Engine": "sqlite"
      },
      "EmbeddedIdP": {
        "Enabled": true,
        "DataDir": "/var/lib/netbird/idp",
        "Issuer": "https://netbird.company.com/oauth2",
        "DashboardRedirectURIs": ["https://netbird.company.com/nb-auth", "https://netbird.company.com/nb-silent-auth"]
      },
      "DeviceAuthorizationFlow": {
        "Provider": "hosted",
        "ProviderConfig": {
          "Audience": "netbird-cli",
          "ClientID": "netbird-cli",
          "TokenEndpoint": "https://netbird.company.com/oauth2/token",
          "DeviceAuthEndpoint": "https://netbird.company.com/oauth2/device/code",
          "Scope": "openid profile email",
          "UseIDToken": false
        }
      },
      "PKCEAuthorizationFlow": {
        "ProviderConfig": {
          "Audience": "netbird-dashboard",
          "ClientID": "netbird-dashboard",
          "AuthorizationEndpoint": "https://netbird.company.com/oauth2/auth",
          "TokenEndpoint": "https://netbird.company.com/oauth2/token",
          "Scope": "openid profile email offline_access",
          "RedirectURLs": ["http://localhost:53000"],
          "UseIDToken": false
        }
      }
    }

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: netbird.company.com
        paths:
          - path: /api
            pathType: ImplementationSpecific
          - path: /oauth2
            pathType: ImplementationSpecific
          - path: /keys
            pathType: ImplementationSpecific
          - path: /.well-known
            pathType: ImplementationSpecific
          - path: /instance
            pathType: ImplementationSpecific
          - path: /setup
            pathType: ImplementationSpecific
    tls:
      - secretName: netbird-api-tls
        hosts:
          - netbird.company.com

  ingressGrpc:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: GRPC
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hosts:
      - host: netbird.company.com
        paths:
          - path: /management.ManagementService
            pathType: ImplementationSpecific
    tls:
      - secretName: netbird-grpc-tls
        hosts:
          - netbird.company.com

  persistentVolume:
    enabled: true

  useBackwardsGrpcService: true

signal:
  image:
    tag: latest
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: GRPC
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hosts:
      - host: netbird.company.com
        paths:
          - path: /signalexchange.SignalExchange
            pathType: ImplementationSpecific
    tls:
      - secretName: netbird-signal-tls
        hosts:
          - netbird.company.com

relay:
  resources:
    requests:
      cpu: 300m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 256Mi
  image:
    tag: latest
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
      nginx.ingress.kubernetes.io/websocket-services: "netbird-relay"
    hosts:
      - host: netbird.company.com
        paths:
          - path: /relay
            pathType: ImplementationSpecific
      - host: relay.company.com
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: netbird-relay-tls
        hosts:
          - netbird.company.com
          - relay.company.com

  envFromSecret:
    NB_AUTH_SECRET: netbird-secrets/relayPassword

  env:
    NB_LOG_LEVEL: info
    NB_LISTEN_ADDRESS: ":33080"
    NB_EXPOSED_ADDRESS: rels://relay.company.com:443

dashboard:
  enabled: true
  image:
    tag: v2.90.5
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: netbird.company.com
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: netbird-dashboard-tls
        hosts:
          - netbird.company.com
  env:
    NETBIRD_MGMT_API_ENDPOINT: https://netbird.company.com
    NETBIRD_MGMT_GRPC_API_ENDPOINT: https://netbird.company.com
    AUTH_AUTHORITY: https://netbird.company.com/oauth2
    AUTH_AUDIENCE: netbird-dashboard
    USE_AUTH0: "false"
    AUTH_SUPPORTED_SCOPES: "openid profile email offline_access"
    AUTH_REDIRECT_URI: /nb-auth
    AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
    NETBIRD_TOKEN_SOURCE: accessToken
    AUTH_CLIENT_ID: netbird-dashboard
    AUTH_CLIENT_SECRET: ""
