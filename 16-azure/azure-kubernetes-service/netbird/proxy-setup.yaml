apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird-reverse-proxy
  namespace: netbird
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: netbird-reverse-proxy-cert-lock
  namespace: netbird
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: netbird-reverse-proxy-cert-lock
  namespace: netbird
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: netbird-reverse-proxy-cert-lock
subjects:
  - kind: ServiceAccount
    name: netbird-reverse-proxy
    namespace: netbird
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbird-proxy-certs
  namespace: netbird
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: managed-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-reverse-proxy
  namespace: netbird
  labels:
    app: netbird-reverse-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbird-reverse-proxy
  template:
    metadata:
      labels:
        app: netbird-reverse-proxy
    spec:
      serviceAccountName: netbird-reverse-proxy
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: reverse-proxy
          image: netbirdio/reverse-proxy:0.74.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 443
              name: https
              protocol: TCP
            - containerPort: 51820
              name: wireguard
              protocol: UDP
          env:
            - name: NB_PROXY_DOMAIN
              value: "proxy.company.com"
            - name: NB_PROXY_TOKEN
              value: "nbx_YOURPROXYTOKENHERE"
            - name: NB_PROXY_MANAGEMENT_ADDRESS
              value: "http://netbird-management-grpc.netbird.svc.cluster.local:33073"
            - name: NB_PROXY_ALLOW_INSECURE
              value: "true"
            - name: NB_PROXY_ADDRESS
              value: ":443"
            - name: NB_PROXY_ACME_CERTIFICATES
              value: "true"
            - name: NB_PROXY_ACME_CHALLENGE_TYPE
              value: "http-01"
            - name: NB_PROXY_ACME_ADDRESS
              value: ":80"
            - name: NB_PROXY_CERTIFICATE_DIRECTORY
              value: "/certs"
            - name: NB_PROXY_LOG_LEVEL
              value: "info"
            - name: NB_PROXY_WG_PORT
              value: "51820"
            - name: NB_PROXY_PRIVATE
              value: "true"
            - name: NB_PROXY_CERT_LOCK_METHOD
              value: "k8s-lease"
            - name: NB_PROXY_HEALTH_ADDRESS
              value: "0.0.0.0:8080"
            - name: NB_DISABLE_CUSTOM_ROUTING
              value: "true"
          securityContext:
            runAsUser: 1000
            capabilities:
              add:
                - NET_BIND_SERVICE
                - NET_ADMIN
          volumeMounts:
            - name: certs
              mountPath: /certs
            - name: tun-device
              mountPath: /dev/net/tun
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: certs
          persistentVolumeClaim:
            claimName: netbird-proxy-certs
        - name: tun-device
          hostPath:
            path: /dev/net/tun
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-reverse-proxy
  namespace: netbird
spec:
  type: LoadBalancer
  selector:
    app: netbird-reverse-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
    - name: wireguard
      port: 51820
      targetPort: 51820
      protocol: UDP
